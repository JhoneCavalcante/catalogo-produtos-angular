<h2>Catálogo de Produtos</h2>
<ul>
    <li *ngFor="let produto of produtos"
        [ngClass]= "{ indisponivel : !produto.disponivel}">
        <strong>{{ produto.nome }}</strong> <br>
        preço: R$ {{ produto.preco }} <br>
        status:
        <span *ngIf="produto.disponivel">Disponível</span>
        <span *ngIf="!produto.disponivel">Indisponível</span>
    </li>
</ul>
